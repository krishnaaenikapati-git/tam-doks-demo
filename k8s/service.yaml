apiVersion: v1
kind: Service
metadata:
  name: tam-demo
  namespace: tam-demo
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-type: REGIONAL
    service.beta.kubernetes.io/do-loadbalancer-name: tam-assessment-http
spec:
  type: LoadBalancer
  selector:
    app: tam-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
